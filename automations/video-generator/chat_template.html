<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<title>Chat</title>
<style>
  :root {
    --ink: #17203A;
    --ink-soft: #5B6478;
    --paper: #EDEFF3;
    --surface: #FFFFFF;
    --bubble-in: #FFFFFF;
    --bubble-out: #DCEEE9;
    --accent: #1E7F6E;
    --accent-ink: #0F4A40;
    --border: #DADFE6;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--paper);
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  .status-bar {
    height: 28px; background: var(--surface); flex: none;
  }
  .chat-header {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 14px; background: var(--surface);
    border-bottom: 1px solid var(--border); flex: none;
  }
  .avatar {
    width: 38px; height: 38px; border-radius: 50%;
    background: var(--accent); color: #fff; display: flex;
    align-items: center; justify-content: center; font-size: 18px; flex: none;
  }
  .chat-header .name { font-weight: 600; font-size: 15px; color: var(--ink); }
  .chat-header .status { font-size: 12px; color: var(--accent); }

  .chat-body {
    flex: 1; padding: 16px 12px; display: flex; flex-direction: column; gap: 10px;
    overflow: hidden;
  }

  .bubble {
    max-width: 78%; padding: 10px 13px; border-radius: 14px;
    font-size: 14.5px; line-height: 1.4; color: var(--ink);
    box-shadow: 0 1px 2px rgba(0,0,0,0.06);
    opacity: 0; transform: translateY(8px);
    animation: rise 0.25s ease-out forwards;
  }
  @keyframes rise { to { opacity: 1; transform: translateY(0); } }

  .bubble.in { align-self: flex-start; background: var(--bubble-in); border-bottom-left-radius: 4px; }
  .bubble.out { align-self: flex-end; background: var(--bubble-out); color: var(--accent-ink); border-bottom-right-radius: 4px; }

  .typing {
    align-self: flex-start; background: var(--bubble-in); padding: 12px 16px;
    border-radius: 14px; border-bottom-left-radius: 4px; display: flex; gap: 4px;
  }
  .typing span {
    width: 6px; height: 6px; border-radius: 50%; background: var(--ink-soft);
    animation: bounce 1s infinite;
  }
  .typing span:nth-child(2) { animation-delay: 0.15s; }
  .typing span:nth-child(3) { animation-delay: 0.3s; }
  @keyframes bounce { 0%,60%,100% { transform: translateY(0); } 30% { transform: translateY(-4px); } }

  .menu {
    align-self: flex-start; display: flex; flex-direction: column; gap: 6px;
    max-width: 82%;
  }
  .menu-btn {
    padding: 10px 14px; background: var(--surface); border: 1.5px solid var(--border);
    border-radius: 10px; font-size: 14px; font-weight: 600; color: var(--ink);
    transition: transform 0.15s, background 0.15s, border-color 0.15s;
  }
  .menu-btn.pressed { background: var(--accent); border-color: var(--accent); color: #fff; transform: scale(0.96); }

  #hook-overlay {
    position: fixed; inset: 0; background: var(--accent); z-index: 9999999;
    display: flex; align-items: center; justify-content: center; padding: 28px;
    text-align: center;
  }
  #hook-text {
    font-size: 27px; font-weight: 800; color: #fff; line-height: 1.32;
    text-wrap: balance;
  }
</style>
</head>
<body>
  <div id="hook-overlay">
    <div id="hook-text"></div>
  </div>
  <div class="status-bar"></div>
  <div class="chat-header">
    <div class="avatar" id="avatar">🏢</div>
    <div>
      <div class="name" id="business-name">Tu Negocio</div>
      <div class="status">en línea</div>
    </div>
  </div>
  <div class="chat-body" id="chat-body"></div>

  <script>
    var qs = new URLSearchParams(location.search);
    document.getElementById('business-name').textContent = qs.get('business') || 'Tu Negocio';

    var body = document.getElementById('chat-body');

    function scrollDown() { body.scrollTop = body.scrollHeight; }

    window.addMessage = function (text, who) {
      var b = document.createElement('div');
      b.className = 'bubble ' + who;
      b.textContent = text;
      body.appendChild(b);
      scrollDown();
    };

    window.showTyping = function () {
      var t = document.createElement('div');
      t.className = 'typing';
      t.id = 'typing-indicator';
      t.innerHTML = '<span></span><span></span><span></span>';
      body.appendChild(t);
      scrollDown();
    };

    window.hideTyping = function () {
      var t = document.getElementById('typing-indicator');
      if (t) t.remove();
    };

    window.showMenu = function () {
      var menu = document.createElement('div');
      menu.className = 'menu';
      menu.id = 'bot-menu';
      menu.innerHTML =
        '<div class="menu-btn" id="btn-cita">📅 Agendar cita</div>' +
        '<div class="menu-btn" id="btn-servicios">🛠️ Servicios</div>' +
        '<div class="menu-btn" id="btn-horario">🕐 Horario</div>' +
        '<div class="menu-btn" id="btn-ubicacion">📍 Ubicación</div>';
      body.appendChild(menu);
      scrollDown();
    };

    window.pressCita = function () {
      var btn = document.getElementById('btn-cita');
      if (btn) btn.classList.add('pressed');
    };

    window.showHook = function (text) {
      document.getElementById('hook-text').textContent = text;
    };

    window.hideHook = function () {
      var el = document.getElementById('hook-overlay');
      if (el) el.remove();
    };
  </script>
</body>
</html>
