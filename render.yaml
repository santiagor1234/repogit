services:
  - type: web
    name: booking-api
    runtime: python
    plan: free
    rootDir: automations/booking-api
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DB_PATH
        value: citas.db
      - key: GOOGLE_SHEETS_WEBHOOK_URL
        sync: false
